[project]
name = "owner-lens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shiva Chittamuru", email = "shiva.vy147@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
owner-lens = "owner_lens:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
# The local research workbench (Feature 7D). Kept out of the runtime
# dependencies so importing owner_lens never pulls in a UI stack, and installed
# by default so `uv sync` is enough to launch it.
workbench = [
    "streamlit>=1.41.0",
]

[tool.uv]
default-groups = ["dev", "workbench"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
